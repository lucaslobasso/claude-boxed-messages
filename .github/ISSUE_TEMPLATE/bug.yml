name: Bug report
description: Something looks wrong or doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "`claude plugin list` shows it"
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: "`claude --version`"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: OS and terminal
      placeholder: Windows 11, Windows Terminal / macOS, iTerm2 / ...
  - type: input
    id: settings
    attributes:
      label: Settings
      description: "Output of `/boxed-messages`"
